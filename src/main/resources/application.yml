spring:
  application:
    name: ZapMart

  datasource:
    url: jdbc:postgresql://localhost:5433/ZapMart_DB
    username: zapmart
    password: zapmart_dev_pw
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6380

server:
  port: 9090

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

idempotency:
  enabled: true
  cache-enabled: true
  ttl-hours: 24
  lock-seconds: 60
  cleanup-batch-size: 1000
  cleanup-interval-ms: 3600000
  cleanup-initial-delay-ms: 60000