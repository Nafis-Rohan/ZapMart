services:
  postgres:
    image: postgres:16
    container_name: zapmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ZapMart_DB
      POSTGRES_USER: zapmart
      POSTGRES_PASSWORD: zapmart_dev_pw
    ports:
      - "5433:5432"
    volumes:
      - zapmart_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: zapmart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  zapmart_pg_data: